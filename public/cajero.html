<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Cajero — Bingo Tavarez</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#060310;color:#fff;font-family:'Cinzel',serif;min-height:100vh}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
#login-box{background:#0d0528;border:1px solid #d4a93a44;border-radius:16px;padding:28px 24px;width:100%;max-width:340px}
#login-box h1{font-family:'Cinzel Decorative',serif;color:#d4a93a;font-size:16px;text-align:center;margin-bottom:6px}
#login-box p{font-size:10px;color:#555;text-align:center;margin-bottom:20px;letter-spacing:1px}
.field{margin-bottom:12px}
.field label{font-size:10px;color:#888;letter-spacing:1px;display:block;margin-bottom:4px}
.field input{width:100%;padding:10px 14px;background:#05020f;border:1.5px solid #2a1060;
  border-radius:10px;color:#fff;font-family:'Cinzel',serif;font-size:13px;outline:none}
.field input:focus{border-color:#d4a93a}
.btn-primary{width:100%;padding:12px;background:linear-gradient(135deg,#d4a93a,#aa8020);
  color:#000;border:none;border-radius:10px;font-family:'Cinzel Decorative',serif;
  font-size:13px;font-weight:700;cursor:pointer;letter-spacing:1px}
#login-error{color:#ff4466;font-size:11px;text-align:center;margin-top:8px;min-height:16px}

/* CAJERO PANEL */
#cajero-panel{display:none;min-height:100vh}
#cajero-header{background:linear-gradient(90deg,#0a0220,#1a0640);padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d4a93a22;
  position:sticky;top:0;z-index:10}
#cajero-header h2{font-family:'Cinzel Decorative',serif;font-size:13px;color:#d4a93a}
#cajero-header .info{font-size:10px;color:#888}
#logout-btn{background:none;border:1px solid #d4a93a44;border-radius:6px;color:#888;
  font-size:10px;padding:4px 10px;cursor:pointer;font-family:'Cinzel',serif}

#stats-bar{display:flex;gap:10px;padding:10px 14px;background:#05020f;border-bottom:1px solid #ffffff08}
.stat{text-align:center;flex:1}
.stat .sv{font-size:16px;color:#ffd700;font-weight:900}
.stat .sl{font-size:8px;color:#555;letter-spacing:1px;text-transform:uppercase}

#cards-container{padding:10px}
#cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.cajero-card{background:#f0f4ff;border-radius:10px;padding:8px;border:2px solid #c0cce8;
  transition:all .2s;position:relative}
.cajero-card.sold{background:linear-gradient(135deg,#e8fff0,#d0fde0);border-color:#44ff88}
.cajero-card.sold .card-number{background:#44ff88;color:#003300}

.card-number{position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:50%;
  background:#1a0840;color:#d4a93a;font-size:8px;font-weight:900;
  display:flex;align-items:center;justify-content:center}

.card-mini-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;margin:20px 0 6px}
.cmc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:2px;font-size:6px;font-weight:700;background:#e0e8ff;color:#334}
.cmc.free{background:#3377ff;color:#fff;font-size:5px}

.card-name-input{width:100%;padding:5px 8px;border:1px solid #c0cce8;border-radius:6px;
  font-family:'Cinzel',serif;font-size:10px;background:#fff;color:#334;outline:none;margin-bottom:5px}
.card-name-input:focus{border-color:#44aa88}

.sell-btn{width:100%;padding:6px;border:none;border-radius:7px;font-family:'Cinzel',serif;
  font-size:9px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:all .2s}
.sell-btn.unsold{background:#1a0840;color:#d4a93a;border:1px solid #d4a93a44}
.sell-btn.unsold:active{background:#d4a93a;color:#000}
.sell-btn.sold-state{background:#003300;color:#44ff88;border:1px solid #44ff8844}

/* Sold player name */
.sold-name{font-size:9px;color:#007700;text-align:center;font-weight:700;
  margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div id="login-box">
    <h1>✦ BINGO TAVAREZ ✦</h1>
    <p>PANEL DEL CAJERO</p>
    <div class="field">
      <label>USUARIO</label>
      <input type="text" id="login-user" placeholder="local1" autocomplete="off" autocapitalize="off">
    </div>
    <div class="field">
      <label>CONTRASEÑA</label>
      <input type="password" id="login-pass" placeholder="••••••">
    </div>
    <button class="btn-primary" onclick="doLogin()">ENTRAR</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- CAJERO PANEL -->
<div id="cajero-panel">
  <div id="cajero-header">
    <div>
      <h2 id="local-title">Local</h2>
      <div class="info" id="game-status">Cargando...</div>
    </div>
    <button id="logout-btn" onclick="logout()">Salir</button>
  </div>

  <div id="stats-bar">
    <div class="stat"><div class="sv" id="st-sold">0</div><div class="sl">Vendidos</div></div>
    <div class="stat"><div class="sv" id="st-available">0</div><div class="sl">Disponibles</div></div>
    <div class="stat"><div class="sv" id="st-income">$0</div><div class="sl">Ingresos</div></div>
  </div>

  <div id="cards-container">
    <div id="cards-grid"></div>
  </div>
</div>

<script>
let token = localStorage.getItem('cajero_token');
let localId = parseInt(localStorage.getItem('cajero_localId') || '0');
let cards = [];

// Auto-login if token exists
if(token) loadCards();

async function doLogin(){
  const user = document.getElementById('login-user').value.trim().toLowerCase();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  try{
    const r = await fetch('/api/cajero/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username: user, password: pass})
    });
    const d = await r.json();
    if(!r.ok){errEl.textContent = d.error; return;}
    token = d.token;
    localId = d.localId;
    localStorage.setItem('cajero_token', token);
    localStorage.setItem('cajero_localId', localId);
    document.getElementById('local-title').textContent = '✦ ' + d.name;
    showPanel();
    loadCards();
  }catch(e){errEl.textContent = 'Error de conexión';}
}

function showPanel(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('cajero-panel').style.display = 'block';
}

function logout(){
  localStorage.removeItem('cajero_token');
  localStorage.removeItem('cajero_localId');
  token = null;
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('cajero-panel').style.display = 'none';
}

async function loadCards(){
  try{
    const r = await fetch('/api/cajero/cards', {
      headers: {Authorization: 'Bearer ' + token}
    });
    if(r.status === 401){logout(); return;}
    const d = await r.json();
    cards = d.cards;
    document.getElementById('local-title').textContent = '✦ ' + (d.localName || `Local ${localId}`);
    renderCards();
    updateStats();
    showPanel();
  }catch(e){
    document.getElementById('game-status').textContent = 'Error de conexión';
  }
}

function renderCards(){
  const grid = document.getElementById('cards-grid');
  grid.innerHTML = '';
  cards.forEach((card, i) => {
    const div = document.createElement('div');
    div.className = 'cajero-card' + (card.sold ? ' sold' : '');
    div.id = `ccard-${i}`;

    // Card number badge
    div.innerHTML = `<div class="card-number">${i+1}</div>`;

    // Mini grid
    let gridHtml = '<div class="card-mini-grid">';
    if(card.grid && Array.isArray(card.grid)){
      card.grid.forEach((row, r) => {
        row.forEach((n, c) => {
          const isFree = r===2&&c===2;
          gridHtml += `<div class="cmc${isFree?' free':''}">${isFree?'F':n}</div>`;
        });
      });
    }
    gridHtml += '</div>';
    div.innerHTML += gridHtml;

    // Player name or sold name
    if(card.sold){
      div.innerHTML += `<div class="sold-name">✅ ${card.playerName}</div>`;
      div.innerHTML += `<button class="sell-btn sold-state" onclick="toggleSell(${i})">✅ VENDIDO</button>`;
    } else {
      div.innerHTML += `<input class="card-name-input" id="inp-${i}" placeholder="Nombre jugador..." value="${card.playerName||''}">`;
      div.innerHTML += `<button class="sell-btn unsold" onclick="toggleSell(${i})">🛒 VENDER</button>`;
    }

    grid.appendChild(div);
  });
}

async function toggleSell(idx){
  const card = cards[idx];
  const action = card.sold ? 'unsell' : 'sell';
  const inp = document.getElementById(`inp-${idx}`);
  const playerName = (inp && inp.value.trim()) ? inp.value.trim() : (card.playerName || `Cartón ${idx+1}`);
  // If selling and no name entered, prompt for name
  if(action === 'sell' && (!inp || !inp.value.trim())){
    const name = prompt(`Nombre del jugador para Cartón ${idx+1}:`);
    if(name === null) return; // cancelled
    cards[idx].playerName = name.trim() || `Cartón ${idx+1}`;
  }
  const finalName = (action === 'sell') ? (cards[idx].playerName || `Cartón ${idx+1}`) : '';

  try{
    const r = await fetch('/api/cajero/sell', {
      method: 'POST',
      headers: {'Content-Type':'application/json', Authorization: 'Bearer ' + token},
      body: JSON.stringify({cardIdx: idx, playerName: action==='sell'?finalName:playerName, action})
    });
    if(!r.ok) return;
    // Update local state
    cards[idx].sold = action === 'sell';
    cards[idx].playerName = action === 'sell' ? playerName : '';
    renderCards();
    updateStats();
  }catch(e){console.error(e);}
}

function updateStats(){
  const sold = cards.filter(c => c.sold).length;
  const available = cards.length - sold;
  document.getElementById('st-sold').textContent = sold;
  document.getElementById('st-available').textContent = available;
  document.getElementById('st-income').textContent = '$' + (sold * 50).toLocaleString();
}

// Auto refresh every 30s
setInterval(loadCards, 30000);

// Enter key on password field
document.addEventListener('keydown', e => {
  if(e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
